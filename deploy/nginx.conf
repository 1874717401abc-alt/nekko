# Nekko Studio - Nginx 反向代理配置
# 把 your-domain.com 替换成你自己的域名，文件放到
# /etc/nginx/sites-available/nekko，然后软链到 sites-enabled 并重载 nginx：
#
#   sudo ln -s /etc/nginx/sites-available/nekko /etc/nginx/sites-enabled/nekko
#   sudo nginx -t && sudo systemctl reload nginx
#
# 之后用 certbot 申请 HTTPS 证书：
#   sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 转发真实请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 websocket（Next.js 开发模式 HMR 用得到，生产环境影响不大但保留无妨）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
